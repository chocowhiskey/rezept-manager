<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🍳 Rezept Manager</h1>
            <p class="subtitle">Speichere deine Lieblingsrezepte</p>
            <div class="user-info">
                <span id="currentUser"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <!-- Add Recipe Section -->
        <section class="add-section">
            <h2>Neues Rezept hinzufügen</h2>
            <div class="input-group">
                <input 
                    type="url" 
                    id="recipeUrl" 
                    placeholder="https://www.chefkoch.de/rezepte/..." 
                    required
                >
                <button id="addBtn" onclick="scrapeRecipe()">
                    <span id="btnText">Rezept hinzufügen</span>
                    <span id="btnLoader" class="loader" style="display: none;"></span>
                </button>
            </div>
            <div id="message" class="message"></div>
        </section>

        <!-- Filter Section -->
        <section class="filter-section">
            <h2>Meine Rezepte</h2>
            <div class="filters">
                <button class="filter-btn active" onclick="filterByTag('all')">Alle</button>
                <button class="filter-btn" onclick="filterByTag('vegetarisch')">🥗 Vegetarisch</button>
                <button class="filter-btn" onclick="filterByTag('vegan')">🌱 Vegan</button>
                <button class="filter-btn" onclick="filterByTag('schnell')">⚡ Schnell</button>
                <button class="filter-btn" onclick="filterByTag('backen')">🍰 Backen</button>
            </div>
        </section>

        <!-- Recipes Grid -->
        <section class="recipes-section">
            <div id="recipesGrid" class="recipes-grid">
                <div class="loading">Lade Rezepte...</div>
            </div>
        </section>
    </div>

    <!-- Recipe Modal -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
